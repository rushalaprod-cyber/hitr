name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target hitr_VST3 hitr_Standalone hitrTest --parallel

      - name: Test des 25 modes
        run: build\hitrTest_artefacts\Release\hitrTest.exe

      - name: Paquet
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build\hitr_artefacts\Release\VST3\h.i.t.r.vst3" out\
          Copy-Item "build\hitr_artefacts\Release\Standalone\h.i.t.r.exe" out\
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out\* -DestinationPath dist\hitr-1.1.0-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: hitr-windows
          path: dist/hitr-*-windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target hitr_VST3 hitr_AU hitr_Standalone hitrTest --parallel 4

      - name: Test des 25 modes
        run: build/hitrTest_artefacts/Release/hitrTest

      - name: Installeur .pkg (VST3 + AU + app, universel Intel / Apple Silicon)
        run: |
          chmod +x packaging/macos/package.sh
          packaging/macos/package.sh build/hitr_artefacts/Release dist 1.1.0

      - uses: actions/upload-artifact@v4
        with:
          name: hitr-macos
          path: dist/hitr-*-macos.*

      - name: Validation Audio Unit (auval)
        run: |
          sudo installer -pkg dist/hitr-1.1.0-macos.pkg -target /
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Hitr Hitr

  # Sur un tag v* : publie une Release GitHub avec les installeurs Windows et Mac
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*

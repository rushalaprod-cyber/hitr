name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Sur un tag v* : chaque plateforme publie ses fichiers dans la Release DÈS qu'elle a fini
# (le Mac n'attend plus Windows). La version est lue dans CMakeLists.txt.
permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: echo "VERSION=$(sed -n 's/^project(hitr VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target hitr_VST3 hitr_AU hitr_Standalone hitrTest --parallel 4

      - name: Test des 50 substances
        run: build/hitrTest_artefacts/Release/hitrTest

      - name: Installeur .pkg (VST3 + AU + app, universel Intel / Apple Silicon)
        run: |
          chmod +x packaging/macos/package.sh
          packaging/macos/package.sh build/hitr_artefacts/Release dist "$VERSION"

      - name: Validation Audio Unit (auval)
        run: |
          sudo installer -pkg "dist/hitr-$VERSION-macos.pkg" -target /
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Hitr Hitr

      - uses: actions/upload-artifact@v4
        with:
          name: hitr-macos
          path: dist/hitr-*-macos.*

      - name: Publication Mac dans la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hitr-*-macos.*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(hitr VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target hitr_VST3 hitr_Standalone hitrTest --parallel

      - name: Test des 50 substances
        run: build\hitrTest_artefacts\Release\hitrTest.exe

      - name: Paquet
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build\hitr_artefacts\Release\VST3\h.i.t.r.vst3" out\
          Copy-Item "build\hitr_artefacts\Release\Standalone\h.i.t.r.exe" out\
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out\* -DestinationPath "dist\hitr-$env:VERSION-windows.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: hitr-windows
          path: dist/hitr-*-windows.zip

      - name: Publication Windows dans la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hitr-*-windows.zip
